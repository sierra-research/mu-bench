name: Deploy Leaderboard

on:
  push:
    branches:
      - main
    paths:
      - "leaderboard/**"
      - "results/leaderboard.json"
  # Avoid GitHub's changed-file cap for large generated-results merges.
  # Inspect the merge diff in the job instead of filtering this event by path.
  pull_request_target:
    types: [closed]
    branches: [main]
  # Manual escape hatch for re-publishing the current state of main.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  changes:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Check merged files
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          if [ "$EVENT_NAME" != pull_request_target ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "${MERGE_SHA}^1" "$MERGE_SHA" -- leaderboard/ results/leaderboard.json | grep -q .; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    concurrency:
      group: "pages"
      cancel-in-progress: true
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The closed-PR event's default ref may predate the merged results.
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: leaderboard
        run: npm ci

      - name: Inject leaderboard data
        run: node leaderboard/scripts/inject-data.js

      - name: Build
        working-directory: leaderboard
        run: npm run build
        env:
          NODE_ENV: production
          GITHUB_PAGES_BASE: /mubench/

      - name: Assemble site
        run: |
          mkdir -p site/mubench
          cp -r leaderboard/dist/* site/mubench/
          echo "research.sierra.ai" > site/CNAME
          # Root: redirect to Sierra's research landing page
          cat > site/index.html << 'REDIRECT'
          <!DOCTYPE html>
          <html>
            <head>
              <meta http-equiv="refresh" content="0; url=https://sierra.ai/resources/research" />
              <link rel="canonical" href="https://sierra.ai/resources/research" />
            </head>
            <body><a href="https://sierra.ai/resources/research">Redirecting to sierra.ai/resources/research...</a></body>
          </html>
          REDIRECT
          # /taubench: redirect to taubench.com
          mkdir -p site/taubench
          cat > site/taubench/index.html << 'REDIRECT'
          <!DOCTYPE html>
          <html>
            <head>
              <meta http-equiv="refresh" content="0; url=https://taubench.com" />
              <link rel="canonical" href="https://taubench.com" />
            </head>
            <body><a href="https://taubench.com">Redirecting to taubench.com...</a></body>
          </html>
          REDIRECT

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
