name: Deploy Leaderboard

on:
  push:
    branches:
      - main
    paths:
      - "leaderboard/**"
      - "results/leaderboard.json"
  # Called by post-merge-score.yml once scoring results land on main. The
  # push trigger above can't be relied on for those commits: a full 5-locale
  # submission writes thousands of results/ files, and GitHub caps the file
  # list it evaluates path filters against, so results/leaderboard.json can
  # fall outside the evaluated set and no run is created.
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build from. Defaults to the triggering ref."
        type: string
        required: false
        default: ""
  # Manual escape hatch for re-publishing the current state of main.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Empty for push/dispatch runs, which check out the triggering ref.
          # Callers pass "main" so the build picks up the scoring commit that
          # was pushed during the calling run, not the base sha it started at.
          ref: ${{ inputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: leaderboard
        run: npm ci

      - name: Inject leaderboard data
        run: node leaderboard/scripts/inject-data.js

      - name: Build
        working-directory: leaderboard
        run: npm run build
        env:
          NODE_ENV: production
          GITHUB_PAGES_BASE: /mubench/

      - name: Assemble site
        run: |
          mkdir -p site/mubench
          cp -r leaderboard/dist/* site/mubench/
          echo "research.sierra.ai" > site/CNAME
          # Root: redirect to Sierra's research landing page
          cat > site/index.html << 'REDIRECT'
          <!DOCTYPE html>
          <html>
            <head>
              <meta http-equiv="refresh" content="0; url=https://sierra.ai/resources/research" />
              <link rel="canonical" href="https://sierra.ai/resources/research" />
            </head>
            <body><a href="https://sierra.ai/resources/research">Redirecting to sierra.ai/resources/research...</a></body>
          </html>
          REDIRECT
          # /taubench: redirect to taubench.com
          mkdir -p site/taubench
          cat > site/taubench/index.html << 'REDIRECT'
          <!DOCTYPE html>
          <html>
            <head>
              <meta http-equiv="refresh" content="0; url=https://taubench.com" />
              <link rel="canonical" href="https://taubench.com" />
            </head>
            <body><a href="https://taubench.com">Redirecting to taubench.com...</a></body>
          </html>
          REDIRECT

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
