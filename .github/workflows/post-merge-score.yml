name: Post-Merge Score

on:
  pull_request_target:
    types: [closed]
    branches: [main]
    paths:
      - "submissions/raw/**"
  workflow_dispatch:
    inputs:
      submission_pr:
        description: "Merged submission PR number to score again"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: post-merge-score
  cancel-in-progress: false

jobs:
  score-and-commit:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: scoring
    steps:
      # App-authenticated pushes trigger CI on the results PR. The app only
      # needs contents:write; PR creation uses this workflow's GITHUB_TOKEN.
      - name: Mint app installation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.MU_BENCH_APP_ID }}
          private-key: ${{ secrets.MU_BENCH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: main
          fetch-depth: 0

      - name: Detect and validate submission directory name
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.submission_pr || github.event.pull_request.number }}
        run: |
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "ERROR: submission_pr must be a PR number"
            exit 1
          fi
          PR_JSON=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER")
          echo "$PR_JSON" | jq -e '.merged == true and .base.ref == "main"' > /dev/null
          MERGE_SHA=$(echo "$PR_JSON" | jq -r '.merge_commit_sha')
          echo "pr=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"
          echo "Merge commit: $MERGE_SHA"
          CHANGED_FILES=$(git diff --name-only "${MERGE_SHA}^1" "${MERGE_SHA}" -- submissions/raw/)
          DIRS=$(echo "$CHANGED_FILES" | sed 's|^\(submissions/raw/[^/]*\)/.*|\1|' | sort -u)
          if [ -z "$DIRS" ]; then
            echo "No submission directory detected"
            exit 1
          fi
          DIR_COUNT=$(echo "$DIRS" | wc -l | tr -d ' ')
          if [ "$DIR_COUNT" -gt 1 ]; then
            echo "ERROR: Multiple submission directories detected. PRs should contain exactly one submission."
            echo "$DIRS"
            exit 1
          fi
          SUBMISSION_DIR=$(echo "$DIRS" | head -1)
          SUBMISSION_NAME=$(basename "$SUBMISSION_DIR")
          if ! echo "$SUBMISSION_NAME" | grep -qE '^[a-zA-Z0-9_-]+$'; then
            echo "ERROR: Submission directory name contains disallowed characters: $SUBMISSION_NAME"
            exit 1
          fi
          echo "dir=$SUBMISSION_DIR" >> "$GITHUB_OUTPUT"
          echo "name=$SUBMISSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Detected submission: $SUBMISSION_DIR"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .[scoring]

      - name: Validate submission
        run: python scoring/validate.py "${{ steps.detect.outputs.dir }}" --manifest manifest.json

      - name: Inject scoring prompts
        env:
          SCORING_PROMPTS_PY: ${{ secrets.SCORING_PROMPTS_PY }}
        run: |
          if [ -z "$SCORING_PROMPTS_PY" ]; then
            echo "ERROR: SCORING_PROMPTS_PY secret is not set"
            exit 1
          fi
          printenv SCORING_PROMPTS_PY > scoring/prompts.py

      # Rebuild the canonical gold cache (submissions/normalized/_gold/) if
      # the manifest gold hash has changed. Idempotent — a no-op when the
      # cache already matches. See scoring/normalize_gold.py.
      - name: Refresh canonical gold cache
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Pinned judge config — keep synchronized across providers.
          SCORING_MODEL: gpt-4.1-2025-04-14
          SCORING_TEMPERATURE: "0.0"
          SCORING_SEED: "7"
        run: python -m scoring.normalize_gold --manifest manifest.json

      # Reuse normalized output from the preceding /score run(s) on this PR.
      # The restore-keys prefix matches any cache written under the same
      # submission name + PR number, so a merge commit inherits the last
      # /score result and only re-normalizes files whose raw content changed.
      - name: Restore normalized cache
        uses: actions/cache@v4
        with:
          path: submissions/normalized/${{ steps.detect.outputs.name }}
          key: normalize-v1-${{ steps.detect.outputs.name }}-${{ steps.detect.outputs.pr }}-${{ steps.detect.outputs.sha }}
          restore-keys: |
            normalize-v1-${{ steps.detect.outputs.name }}-${{ steps.detect.outputs.pr }}-

      - name: Invalidate stale normalized files
        run: |
          python scripts/invalidate_normalized_cache.py invalidate \
            --submission-dir "${{ steps.detect.outputs.dir }}" \
            --normalized-dir "submissions/normalized/${{ steps.detect.outputs.name }}" \
            --judge-model gpt-4.1-2025-04-14 \
            --judge-temperature 0.0 \
            --judge-seed 7 \
            --manifest-gold-hash-file submissions/normalized/_gold/manifest_gold_hash.txt

      - name: Normalize submissions
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SCORING_MODEL: gpt-4.1-2025-04-14
          SCORING_TEMPERATURE: "0.0"
          SCORING_SEED: "7"
        run: |
          python -m scoring.normalize \
            --submission-dir "${{ steps.detect.outputs.dir }}" \
            --manifest manifest.json \
            --output-dir "submissions/normalized/${{ steps.detect.outputs.name }}" \
            --num-workers 25

      - name: Update normalized cache metadata
        run: |
          python scripts/invalidate_normalized_cache.py update \
            --submission-dir "${{ steps.detect.outputs.dir }}" \
            --normalized-dir "submissions/normalized/${{ steps.detect.outputs.name }}" \
            --judge-model gpt-4.1-2025-04-14 \
            --judge-temperature 0.0 \
            --judge-seed 7 \
            --manifest-gold-hash-file submissions/normalized/_gold/manifest_gold_hash.txt

      # Reuse per-utterance significance/WER results from the preceding
      # /score run on this PR. Invalidation drops only detail files whose
      # normalized prediction hash changed, so an identical post-merge
      # tree inherits all of /score's LLM work.
      - name: Restore results cache
        uses: actions/cache@v4
        with:
          path: results/${{ steps.detect.outputs.name }}
          key: results-v1-${{ steps.detect.outputs.name }}-${{ steps.detect.outputs.pr }}-${{ steps.detect.outputs.sha }}
          restore-keys: |
            results-v1-${{ steps.detect.outputs.name }}-${{ steps.detect.outputs.pr }}-

      - name: Invalidate stale results
        run: |
          python scripts/invalidate_results_cache.py invalidate \
            --normalized-dir "submissions/normalized/${{ steps.detect.outputs.name }}" \
            --results-dir "results/${{ steps.detect.outputs.name }}" \
            --judge-model gpt-4.1-2025-04-14 \
            --judge-temperature 0.0 \
            --judge-seed 7 \
            --manifest-gold-hash-file submissions/normalized/_gold/manifest_gold_hash.txt

      - name: Calculate metrics
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SCORING_MODEL: gpt-4.1-2025-04-14
          SCORING_TEMPERATURE: "0.0"
          SCORING_SEED: "7"
        run: |
          python -m scoring.score \
            --submission-dir "${{ steps.detect.outputs.dir }}" \
            --normalized-dir "submissions/normalized/${{ steps.detect.outputs.name }}" \
            --manifest manifest.json \
            --output-dir "results/${{ steps.detect.outputs.name }}" \
            --num-workers 25

      - name: Update results cache metadata
        run: |
          python scripts/invalidate_results_cache.py update \
            --normalized-dir "submissions/normalized/${{ steps.detect.outputs.name }}" \
            --results-dir "results/${{ steps.detect.outputs.name }}" \
            --judge-model gpt-4.1-2025-04-14 \
            --judge-temperature 0.0 \
            --judge-seed 7 \
            --manifest-gold-hash-file submissions/normalized/_gold/manifest_gold_hash.txt

      - name: Merge latency statistics into scores.json
        run: |
          python scripts/latency_stats.py \
            --submission-dir "${{ steps.detect.outputs.dir }}" \
            --manifest manifest.json \
            --output-dir "results/${{ steps.detect.outputs.name }}"

      - name: Check judge-config consistency across providers
        run: python scripts/check_judge_drift.py --results-dir results

      - name: Update leaderboard.json
        run: python -m scoring.update_leaderboard

      - name: Push results branch
        id: publish
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          SUBMISSION_NAME: ${{ steps.detect.outputs.name }}
          SOURCE_PR: ${{ steps.detect.outputs.pr }}
          GH_REPO: ${{ github.repository }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          git add results/ submissions/normalized/
          if git diff --cached --quiet; then
            echo "Scoring results are already current" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # A unique branch avoids force-pushing over an existing results PR.
          BRANCH="codex/scoring-${SOURCE_PR}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$BRANCH"
          git commit --quiet -m "Add scoring results for $SUBMISSION_NAME"
          git push --set-upstream origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "Results for #$SOURCE_PR: https://github.com/$GH_REPO/compare/main...$BRANCH" >> "$GITHUB_STEP_SUMMARY"

      - name: Open results pull request
        if: steps.publish.outputs.branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ steps.publish.outputs.branch }}
          SUBMISSION_NAME: ${{ steps.detect.outputs.name }}
          SOURCE_PR: ${{ steps.detect.outputs.pr }}
        run: |
          cat > "$RUNNER_TEMP/results-pr.md" <<EOF
          Generated scoring results and normalized transcripts for #$SOURCE_PR.

          Merge after checks pass to publish the updated leaderboard. Generated by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID.
          EOF
          gh pr create --base main --head "$BRANCH" \
            --title "Add scoring results for $SUBMISSION_NAME" \
            --body-file "$RUNNER_TEMP/results-pr.md" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Trigger checks on results pull request
        if: steps.publish.outputs.branch != ''
        run: |
          # PRs opened with GITHUB_TOKEN do not start Actions workflows.
          # Push with the app after PR creation to emit a synchronize event
          # that starts the normal CI and Socket checks on the same head.
          git commit --allow-empty --quiet -m "Run checks on generated scoring results"
          git push
