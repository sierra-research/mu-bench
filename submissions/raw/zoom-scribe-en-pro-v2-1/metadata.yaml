model: zoom-scribe-en-pro-v2.1
organization: Zoom
version: "v2.1"
date: "2026-11-03"
notes: |
  English-only (en-US) submission via the Zoom Scribe production API in fast (synchronous) mode.
  Raw API transcripts; latency from the same requests at concurrency 1.
  Server-side segmentation was off for clips up to 30 s (815 of 817).
  override: languageHint because en-US was set explicitly on every request.
config:
  beamSize: default
  languageHint: "en-US"
  customVocabulary: default
  noiseSuppression: default
  domainAdaptation: default
  keywordBoosting: default
